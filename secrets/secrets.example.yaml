# Template of secrets/secrets.yaml, the one file that holds the app's secrets.
# ./scripts/setup.sh copies this file to secrets/secrets.yaml (git-ignored) and adds a generated
# session_secret. Fill in the four values below there, never here. Only the backend's config
# module reads the file (the scripts ask the backend), and changes take effect after a restart.

# OpenAI API key: create one at platform.openai.com; it needs access to gpt-live-1.
openai_api_key: ""
# Serper API key for the web search: create one at serper.dev.
serper_api_key: ""
# The email the team logs in with, for example admin@example.com.
team_email: ""
# The team's password, kept here in plain text on purpose: one shared login for a local MVP.
team_password: ""
