# Alembic's settings for the schema migrations in backend/migrations.
# The database URL is not here: migrations/env.py takes it from the config module, so the app, its
# migrations and the tests always use the same database settings.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
