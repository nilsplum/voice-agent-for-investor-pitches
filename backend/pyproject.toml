# The backend's manifest: every dependency, pinned, and the pytest settings.
# The dependencies are installed only by the image build (backend/Dockerfile), never on the host.
# The backend is not a distributable package, so they are PEP 735 dependency groups, which pip
# installs without building the project: "app" for the server, "test" adds the test tools.
[project]
name = "voice-agent-for-investor-pitches-backend"
version = "0.1.0"
requires-python = ">=3.15"

[dependency-groups]
app = [
    "fastapi==0.163.1",
    "starlette==1.10.0",  # imported directly for its session middleware (pinned to FastAPI's version)
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "sqlalchemy==2.1.8",
    "psycopg[binary]==3.3.9",
    "alembic==1.20.1",
    "argon2-cffi==25.1.0",
    "itsdangerous==2.2.0",  # signs the session cookie
    "pyyaml==6.0.3",
    "httpx==0.28.1",
    "websockets==17.4",  # the sideband's WebSocket client (also used by uvicorn, but imported directly)
]
test = [
    { include-group = "app" },
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "asgi-lifespan==2.1.0",
]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]
# One event loop for the whole session: the app, its lifespan and every async fixture share it.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["real: runs against the real OpenAI and Serper APIs; only with ./scripts/test.sh --complete"]
addopts = ["--durations=5"]  # lists the slowest tests on every run, so a slow one stands out
